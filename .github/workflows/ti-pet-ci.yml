name: ti-pet ci

# TracingInsights' slim native pet (packages/ti-pet). Path-filtered to ti-pet
# so upstream's workflows and their triggers stay untouched; the shared
# inputs (the SDK patches and the upstream sources ti-pet imports) are
# listed too, because a change there can break ti-pet's build.

on:
  push:
    paths:
      - "packages/ti-pet/**"
      - "packages/petdex-desktop-native/src/sprite.zig"
      - "packages/petdex-desktop-native/src/catalog.zig"
      - "patches/native-sdk-*.patch"
      - "scripts/patch-native-sdk.sh"
      - "scripts/check-ti-pet-upstream.sh"
      - ".github/workflows/ti-pet-ci.yml"
      - ".github/workflows/ti-pet-release.yml"
  pull_request:
    paths:
      - "packages/ti-pet/**"
      - "packages/petdex-desktop-native/src/sprite.zig"
      - "packages/petdex-desktop-native/src/catalog.zig"
      - "patches/native-sdk-*.patch"
      - "scripts/patch-native-sdk.sh"
      - "scripts/check-ti-pet-upstream.sh"
      - ".github/workflows/ti-pet-ci.yml"
      - ".github/workflows/ti-pet-release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Pure modules: no SDK, no GUI libraries. Windows too, for the named-pipe
    # code and the path handling that only runs there.
    name: zig test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-2022]
    steps:
      - name: Checkout petdex
        uses: actions/checkout@v7

      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Test the pure modules
        working-directory: packages/ti-pet
        shell: bash
        run: |
          set -euo pipefail
          # Every module listed here must exist: a rename must update this
          # list rather than silently drop its tests.
          for MODULE in protocol timeline state launch countdown motion colorkey; do
            echo "::group::zig test src/$MODULE.zig"
            # launch.zig spawns real detached processes: libc on Linux.
            if [[ "$MODULE" == launch && "$RUNNER_OS" == "Linux" ]]; then
              zig test -lc "src/$MODULE.zig"
            else
              zig test "src/$MODULE.zig"
            fi
            echo "::endgroup::"
          done
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            zig test src/pipe_windows.zig
          fi

      - name: Check copied upstream blocks
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [[ -f scripts/check-ti-pet-upstream.sh ]]; then
            bash scripts/check-ti-pet-upstream.sh
          else
            echo "scripts/check-ti-pet-upstream.sh not present; skipped"
          fi

  build:
    # Linux build of the real app against the pinned, patched SDK — the same
    # steps as ti-pet-release.yml, without staging or publishing.
    name: build linux-x64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout petdex
        uses: actions/checkout@v7

      - name: Install Linux GUI libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libx11-dev pkg-config webp-pixbuf-loader

      - name: Clone the Native SDK
        # Keep identical to ti-pet-release.yml (and upstream's pin).
        env:
          NATIVE_SDK_REMOTE: "https://github.com/Railly/native.git"
          NATIVE_SDK_BRANCH: "feat/floating-window-0.5.3"
          NATIVE_SDK_REF: "c0b10d027efa490fc99a3bc7f1cf88b015999d45"
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$NATIVE_SDK_BRANCH" "$NATIVE_SDK_REMOTE" "$GITHUB_WORKSPACE/native-sdk"
          git -C "$GITHUB_WORKSPACE/native-sdk" fetch --depth 1 origin "$NATIVE_SDK_REF"
          git -C "$GITHUB_WORKSPACE/native-sdk" checkout --detach "$NATIVE_SDK_REF"
          echo "NATIVE_SDK_PATH=$GITHUB_WORKSPACE/native-sdk" >> "$GITHUB_ENV"

      - name: Apply the Native SDK patches
        shell: bash
        run: |
          set -euo pipefail
          scripts/patch-native-sdk.sh
          shopt -s nullglob
          for PATCH in packages/ti-pet/patches/*.patch; do
            if git -C "$NATIVE_SDK_PATH" apply --unidiff-zero --reverse --check "$GITHUB_WORKSPACE/$PATCH" >/dev/null 2>&1; then
              echo "already applied $PATCH"; continue
            fi
            git -C "$NATIVE_SDK_PATH" apply --unidiff-zero "$GITHUB_WORKSPACE/$PATCH"
            echo "applied $PATCH"
          done

      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Build the native CLI from the pinned SDK
        working-directory: ${{ env.NATIVE_SDK_PATH }}
        shell: bash
        run: |
          zig build cli
          echo "NATIVE_CLI=$NATIVE_SDK_PATH/zig-out/bin/native" >> "$GITHUB_ENV"

      - name: Build ti-pet
        working-directory: packages/ti-pet
        shell: bash
        run: |
          "$NATIVE_CLI" build -Dcpu=baseline -Dtrace=off
          ls -lh zig-out/bin/
          test -x zig-out/bin/ti-pet
