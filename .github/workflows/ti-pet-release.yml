name: ti-pet release

# TracingInsights' slim native pet (packages/ti-pet). Separate from
# upstream's desktop-release.yml on purpose: it triggers only on ti-pet-v*
# tags, so upstream workflows stay byte-identical and merge cleanly.
#
# The assets are what tif1ai's desktop/scripts/fetch-native-pet.mjs
# downloads: one bare binary per target, named
#   ti-pet-linux-x64, ti-pet-win32-x64.exe, ti-pet-darwin-arm64,
#   ti-pet-darwin-x64
# plus SHA256SUMS and the license texts of what the binaries contain.
# Releasing: tag ti-pet-vX.Y.Z → this run → copy the hashes from SHA256SUMS
# into tif1ai's desktop/native-pet.json (tag + every sha256 together).

on:
  push:
    tags:
      - "ti-pet-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. ti-pet-v0.1.0)"
        required: true

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
            exe: ""
            build_flags: ""
          - target: win32-x64
            runner: windows-2022
            exe: ".exe"
            build_flags: ""
          # Unsigned on purpose: the binary is nested in the TracingInsights
          # app bundle, and electron-builder signs every Mach-O inside it
          # when the app itself is signed. Unlike upstream's standalone
          # .app there is nothing for Gatekeeper to judge on its own.
          #
          # darwin-arm64 is cross-compiled on the Intel runner (Zig targets
          # aarch64 directly; the runner's Apple SDK links it): GitHub's
          # arm64 macOS runners (macos-15 included) were often not acquired
          # at all in Nov 2026 ("capacity constraints"), which blocked the
          # whole release. The arm64 binary is still run on real arm64
          # hardware by ti-pet-smoke.yml on every change; the stage step
          # below checks the Mach-O arch.
          - target: darwin-arm64
            runner: macos-15-intel
            exe: ""
            build_flags: "-Dtarget=aarch64-macos"
          - target: darwin-x64
            runner: macos-15-intel
            exe: ""
            build_flags: ""

    steps:
      - name: Checkout petdex
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Check the tag
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^ti-pet-v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "not a ti-pet-vX.Y.Z tag: $TAG"; exit 1; }
          # app.zon carries the version the binary reports in `ready`.
          VERSION="${TAG#ti-pet-v}"
          grep -Fq ".version = \"$VERSION\"" packages/ti-pet/app.zon || {
            echo "packages/ti-pet/app.zon .version does not match $TAG"; exit 1; }

      - name: Install Linux GUI libraries
        # Same set as upstream: gtk4 is the host toolkit, libX11 carries
        # _NET_WM_STATE_ABOVE, webp-pixbuf-loader reads Petdex's webp sheets.
        # ubuntu-24.04 like upstream: the Native SDK needs GTK >= 4.10
        # (GtkFileDialog); 22.04 ships 4.6. Older distros get the Electron pet.
        if: matrix.target == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libx11-dev pkg-config webp-pixbuf-loader

      - name: Clone the Native SDK
        # Same pin as upstream's desktop-release.yml and desktop-native-ci.yml
        # (by commit: a mutable fork branch must not change a tagged release).
        # Bump only together with an upstream merge (packages/ti-pet/UPSTREAM.md).
        env:
          NATIVE_SDK_REMOTE: "https://github.com/Railly/native.git"
          NATIVE_SDK_BRANCH: "feat/floating-window-0.5.3"
          NATIVE_SDK_REF: "c0b10d027efa490fc99a3bc7f1cf88b015999d45"
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$NATIVE_SDK_BRANCH" "$NATIVE_SDK_REMOTE" "$GITHUB_WORKSPACE/native-sdk"
          git -C "$GITHUB_WORKSPACE/native-sdk" fetch --depth 1 origin "$NATIVE_SDK_REF"
          git -C "$GITHUB_WORKSPACE/native-sdk" checkout --detach "$NATIVE_SDK_REF"
          echo "NATIVE_SDK_PATH=$GITHUB_WORKSPACE/native-sdk" >> "$GITHUB_ENV"

      - name: Apply the Native SDK patches
        # Upstream's three patches, then ti-pet's own (if any), with the
        # same idempotent check-then-apply rule as scripts/patch-native-sdk.sh.
        shell: bash
        run: |
          set -euo pipefail
          scripts/patch-native-sdk.sh
          shopt -s nullglob
          for PATCH in packages/ti-pet/patches/*.patch; do
            if git -C "$NATIVE_SDK_PATH" apply --unidiff-zero --reverse --check "$GITHUB_WORKSPACE/$PATCH" >/dev/null 2>&1; then
              echo "already applied $PATCH"; continue
            fi
            git -C "$NATIVE_SDK_PATH" apply --unidiff-zero "$GITHUB_WORKSPACE/$PATCH"
            echo "applied $PATCH"
          done

      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Build the native CLI from the pinned SDK
        # The published @native-sdk/cli rejects app.zon's `.floating`; the
        # CLI from the same SDK commit keeps parser and runtime in step.
        working-directory: ${{ env.NATIVE_SDK_PATH }}
        shell: bash
        run: |
          zig build cli
          echo "NATIVE_CLI=$NATIVE_SDK_PATH/zig-out/bin/native" >> "$GITHUB_ENV"

      - name: Build ti-pet
        # -Dcpu=baseline: released binaries must run on every CPU of the
        # target arch, not only the runner's (upstream #604 / #618).
        working-directory: packages/ti-pet
        shell: bash
        run: |
          "$NATIVE_CLI" build -Dcpu=baseline -Dtrace=off ${{ matrix.build_flags }}
          ls -lh zig-out/bin/

      - name: Stage the binary
        working-directory: packages/ti-pet
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stage"
          cp "zig-out/bin/ti-pet${{ matrix.exe }}" "$RUNNER_TEMP/stage/ti-pet-${{ matrix.target }}${{ matrix.exe }}"
          chmod +x "$RUNNER_TEMP/stage/ti-pet-${{ matrix.target }}${{ matrix.exe }}"
          case "${{ matrix.target }}" in
            darwin-arm64) file "$RUNNER_TEMP/stage/ti-pet-darwin-arm64" | grep -q arm64 ;;
            darwin-x64) file "$RUNNER_TEMP/stage/ti-pet-darwin-x64" | grep -q x86_64 ;;
            linux-x64) file "$RUNNER_TEMP/stage/ti-pet-linux-x64" | grep -q 'ELF 64-bit.*x86-64' ;;
          esac
          ls -lh "$RUNNER_TEMP/stage"

      - name: Upload the binary
        uses: actions/upload-artifact@v7
        with:
          name: ti-pet-${{ matrix.target }}
          path: ${{ runner.temp }}/stage/ti-pet-${{ matrix.target }}${{ matrix.exe }}
          if-no-files-found: error

  release:
    name: publish GitHub release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout petdex
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download all binaries
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f -name "ti-pet-*" -exec cp {} release/ \;
          for ASSET in ti-pet-linux-x64 ti-pet-win32-x64.exe ti-pet-darwin-arm64 ti-pet-darwin-x64; do
            test -f "release/$ASSET" || { echo "missing $ASSET"; exit 1; }
          done
          # Licenses of what the binaries contain: this fork (MIT) and the
          # Native SDK at the pinned commit (Apache-2.0; it has no NOTICE
          # file, and ti-pet is native-only, so no WebView2 loader ships).
          # tif1ai commits the same texts in desktop/resources/ti-pet/.
          SDK_REF=c0b10d027efa490fc99a3bc7f1cf88b015999d45
          cp LICENSE release/ti-pet-LICENSE-petdex.txt
          curl -fsSL "https://raw.githubusercontent.com/Railly/native/$SDK_REF/LICENSE" -o release/ti-pet-LICENSE-native-sdk.txt
          grep -q "Apache License" release/ti-pet-LICENSE-native-sdk.txt
          (cd release && sha256sum ti-pet-* > SHA256SUMS)
          cat release/SHA256SUMS
          ls -lh release/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }} (TracingInsights pet)
          body: |
            Native pet for the TracingInsights desktop app (packages/ti-pet).
            Not a Petdex desktop release: install Petdex from its own desktop-v* releases.
            Pin these assets in tif1ai's desktop/native-pet.json from SHA256SUMS.
          files: release/*
          fail_on_unmatched_files: true
          # Never "latest": the fork's latest release must stay whatever
          # upstream's desktop-v* flow publishes, so nothing that reads
          # /releases/latest mistakes this for a Petdex desktop build.
          make_latest: false
          prerelease: false
